<div class="footer-inner">
  <div class="footer-top">
    <section class="footer-intro">
      <h2 class="footer-title">{{ t().footer.title }}</h2>
      <span class="footer-rule"></span>
      <p class="footer-text">{{ t().footer.availability }}</p>
    </section>

    <ul class="footer-contacts">
      <li class="footer-contact">
        <span class="footer-contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="5" width="19" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
        </span>
        <span class="footer-contact-body">
          <span class="footer-contact-label">{{ t().footer.emailLabel }}</span>
          <a class="footer-contact-value" [href]="'mailto:' + email">{{ email }}</a>
        </span>
      </li>

      <li class="footer-contact">
        <span class="footer-contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M21 4.5L2.5 11.2l5.6 1.9L19 6.5l-8.4 8.2.3 5.3 3-4 4.4 3z" />
          </svg>
        </span>
        <span class="footer-contact-body">
          <span class="footer-contact-label">{{ t().footer.telegramLabel }}</span>
          <a
            class="footer-contact-value"
            [href]="'https://t.me/' + telegram"
            rel="noopener"
            target="_blank"
            >{{ '@' + telegram }}</a
          >
        </span>
      </li>

      <li class="footer-contact">
        <span class="footer-contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        <span class="footer-contact-body">
          <span class="footer-contact-label">{{ t().footer.locationLabel }}</span>
          <span class="footer-contact-value">{{ t().footer.location }}</span>
        </span>
      </li>
    </ul>
  </div>

  <div class="footer-bottom">
    <span class="footer-note">© 2026 GUSEYNOV RUSLAN</span>
    <span class="footer-note">{{ t().footer.rights }}</span>
  </div>
</div>
